services:
  - type: web
    name: seven-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seven-store-db
          property: connectionString

databases:
  - name: seven-store-db
    databaseName: seven_store
    user: seven_store
