<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Seven Store — Criar conta</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="pagina-login"><div class="login-container"><div class="logo"><img src="{{ url_for('static', filename='seven-store-logo.jpg') }}" alt="Seven Store Boutique"><h1>CRIAR CONTA</h1><p>Cadastre um novo acesso ao sistema</p><span>Seven Store · Versão 0.6</span></div><form action="{{ url_for('cadastrar') }}" method="POST"><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" placeholder="Crie seu usuário" autocomplete="username" required><label for="senha">Senha</label><input type="password" id="senha" name="senha" placeholder="Crie sua senha" autocomplete="new-password" required>{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}<button type="submit">CRIAR CONTA</button></form><div class="cadastro-link"><a href="{{ url_for('login') }}">← Voltar para o login</a></div></div></body></html>
