<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Store - Criar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
<div class="login-container">
    <div class="logo">
        <h1>SEVEN STORE</h1>
        <p>Criar nova conta</p>
        <span>Versão 0.5.3</span>
    </div>
    <form action="/cadastrar" method="POST">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Crie seu usuário" autocomplete="username" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie sua senha" autocomplete="new-password" required>
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        <button type="submit">CRIAR CONTA</button>
    </form>
    <div class="cadastro-link">
        <a href="/">← Voltar para o Login</a>
    </div>
</div>
</body>
</html>
