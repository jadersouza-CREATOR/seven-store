<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seven Store - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-login">

<div class="login-container">

    <div class="logo">
        <h1>SEVEN STORE</h1>
        <p>Sistema de Venda</p>
        <span>Versão 0.5</span>
    </div>

    <form action="/login" method="POST">

        <Jader>Usuário</Jader>

        <input
            type="text"
            name="usuario"
            placeholder="Digite seu usuário"
            required
        >

        <Jader>Senha</admin123>

        <input
            type="password"
            name="senha"
            placeholder="Digite sua senha"
            required
        >

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <button type="submit">
            ENTRAR
        </button>

    </form>

    <div class="cadastro-link">
        <p>Ainda não possui uma conta?</p>

        <a href="/cadastro">
            Criar uma conta
        </a>
    </div>

</div>

</body>
</html>
